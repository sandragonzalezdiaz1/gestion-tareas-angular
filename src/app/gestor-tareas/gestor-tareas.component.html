<mat-card class="tareas-card">
  <mat-card-header>
    <mat-card-title>Mis tareas</mat-card-title>
    <mat-card-subtitle>Organiza tu día de forma sencilla</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <app-form-tarea (crearTarea) = "agregarTarea($event)"></app-form-tarea>
  </mat-card-content>

  @if (tareas().length == 0) {
  <p class="sin-tareas">No hay tareas pendientes</p>

  } @else {
  <div class="listado-tareas">
    <ul>
      @for (tarea of tareas() | ordenarPrioridad; track tarea.id) {
        <app-item-tarea [tarea]="tarea" (tareaAEliminar)="eliminarTarea(tarea.id)"></app-item-tarea>
      }
    </ul>
  </div>
}
